<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>真实人生 · 3D</title>
<link rel="stylesheet" href="fonts/Fusion-Pixel-12px-Proportional-Simplified-Chinese.css">
<style>
/* 全屏 3D 小镇，界面浮在上面。像素字体只用 12px 和 24px，保证每个像素都落在整数位置上。 */
:root{
  --bg:#0b1120;
  --panel:#131c2f;
  --panel-2:#1c2740;
  --edge:#33456b;
  --ink:#e8edf7;
  --muted:#93a1bd;
  --sky:#8fd3ff;
  --tally:#ff4d4f;
  --paper:#f3ead3;
  --paper-ink:#2b2620;
  --paper-muted:#6b6358;
  --warn:#ffb648;
  --calm:#6fd6a8;
  --px:"Fusion Pixel 12px Proportional Simplified Chinese","PingFang SC","Microsoft YaHei",sans-serif;
  --gut-l:max(14px,env(safe-area-inset-left,0px));
  --gut-r:max(14px,env(safe-area-inset-right,0px));
  --gut-t:max(14px,env(safe-area-inset-top,0px));
  --gut-b:max(14px,env(safe-area-inset-bottom,0px));
  --top-h:74px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:clip;background:var(--bg)}
body{color:var(--ink);font:12px/18px var(--px);-webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
#game{position:relative;width:100%;height:100%;overflow:clip}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}

/* 像素边框：四条外阴影拼出缺角的方框 */
.px{background:var(--panel);box-shadow:3px 0 0 0 var(--edge),-3px 0 0 0 var(--edge),0 3px 0 0 var(--edge),0 -3px 0 0 var(--edge),inset 0 3px 0 0 rgba(255,255,255,.05)}
.pbtn{appearance:none;border:0;background:var(--panel-2);color:var(--ink);padding:3px 9px;cursor:pointer;line-height:18px;box-shadow:2px 0 0 0 var(--edge),-2px 0 0 0 var(--edge),0 2px 0 0 var(--edge),0 -2px 0 0 var(--edge)}
.pbtn:hover:not(:disabled){background:#25335a}
.pbtn:active:not(:disabled){transform:translateY(1px)}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.pbtn[aria-pressed="true"],.pbtn[aria-selected="true"],.pbtn.primary{background:var(--sky);color:var(--bg)}

/* 顶部状态条 */
.top{position:absolute;z-index:5;top:var(--gut-t);left:var(--gut-l);right:var(--gut-r);display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:8px 14px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{font-size:24px;line-height:24px;color:var(--sky)}
.onair{background:var(--tally);color:#fff;padding:0 6px;letter-spacing:.1em}
.shooting .onair{animation:pulse 1s steps(2,start) infinite}
@keyframes pulse{50%{opacity:.5}}
.brand small{color:var(--muted)}
.back{color:var(--muted);text-decoration:none}
.back:hover{color:var(--sky)}
.clock{display:flex;align-items:baseline;gap:10px}
.clock b{font-weight:400;font-size:24px;line-height:24px;font-variant-numeric:tabular-nums}
#clock-day{font-size:12px;color:var(--muted)}
.chip{padding:0 6px;background:var(--panel-2);color:var(--sky)}
.chip.ff{background:var(--warn);color:#2b1d00}
.shooting .chip{background:var(--tally);color:#fff}
.speed{display:flex;gap:6px}
.stats{display:flex;gap:18px;align-items:flex-end}
.stat{display:flex;flex-direction:column}
.stat > span{color:var(--muted)}
.stat b{font-weight:400;font-size:24px;line-height:24px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--muted)}
#rate.low{color:var(--warn)}
.bar{display:inline-block;width:72px;height:6px;background:var(--panel-2);position:relative}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--calm);display:block}
.crew{display:flex;flex-direction:column;gap:2px;max-width:210px}
.crew-row{display:flex;gap:6px}
.crew select{background:var(--panel-2);border:0;padding:2px 4px;box-shadow:0 0 0 2px var(--edge)}
#ai-status{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 警报、拍摄提示条、提示 */
.alert{position:absolute;z-index:5;left:var(--gut-l);top:calc(var(--gut-t) + var(--top-h) + 6px);max-width:min(520px,calc(100% - 340px));padding:4px 10px;background:#3a1620;color:#ffd7d8;box-shadow:2px 0 0 0 var(--tally),-2px 0 0 0 var(--tally),0 2px 0 0 var(--tally),0 -2px 0 0 var(--tally)}
.alert.run{background:var(--tally);color:#fff;animation:pulse 1s steps(2,start) infinite}
.shoot{position:absolute;z-index:6;left:50%;transform:translateX(-50%);top:calc(var(--gut-t) + var(--top-h) + 8px);width:min(560px,calc(100% - 2 * var(--gut-l)));padding:8px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.shoot .rec{color:var(--tally)}
#shoot-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shoot-cap{grid-column:1 / -1;margin:0;color:var(--paper);min-height:18px}
.shoot .btns{display:flex;gap:6px}
.toast{position:absolute;z-index:7;left:50%;transform:translateX(-50%);bottom:200px;max-width:calc(100% - 2 * var(--gut-l));padding:4px 12px;background:var(--panel);color:var(--ink);box-shadow:2px 0 0 0 var(--sky),-2px 0 0 0 var(--sky),0 2px 0 0 var(--sky),0 -2px 0 0 var(--sky)}
.toast.bad{box-shadow:2px 0 0 0 var(--warn),-2px 0 0 0 var(--warn),0 2px 0 0 var(--warn),0 -2px 0 0 var(--warn);color:var(--warn)}
.danmu{position:absolute;z-index:2;left:0;right:0;top:calc(var(--gut-t) + var(--top-h) + 64px);height:110px;pointer-events:none;overflow:hidden}
.danmu span{position:absolute;left:100%;white-space:nowrap;color:#fff;text-shadow:1px 1px 0 #000,-1px 0 0 #000}

/* 右侧抽屉 */
.drawer{position:absolute;z-index:4;right:var(--gut-r);top:calc(var(--gut-t) + var(--top-h) + 6px);width:300px;height:calc(100% - var(--top-h) - 250px);min-height:220px;display:flex;transform:translateX(calc(100% + var(--gut-r) + 6px));transition:transform .25s steps(5)}
.drawer.open{transform:none}
.drawer-tab{position:absolute;left:-38px;top:0;width:30px;padding:8px 0;writing-mode:vertical-rl;letter-spacing:.2em}
.drawer-body{display:flex;flex-direction:column;gap:10px;width:100%;padding:10px 12px;min-height:0}
.tabs{display:flex;gap:8px}
.tabs .pbtn small{color:inherit;opacity:.75}
.panel{overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.drawer h3{margin:0;font-weight:400;color:var(--muted);display:flex;justify-content:space-between}
.now{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.now dt{color:var(--muted)}
.now dd{margin:0}
.mind{margin:0;color:var(--paper)}
.sched{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sched li{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:1px 4px}
.sched li time{color:var(--muted)}
.sched li.done{opacity:.45}
.sched li.now{background:var(--sky);color:var(--bg)}
.sched li.now time{color:var(--bg)}
.sched li.extra:not(.now){color:var(--warn)}
.diary{margin:0;padding:6px 8px;background:var(--paper);color:var(--paper-ink)}
.l-diary{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.l-diary .slate{align-self:flex-start;background:var(--paper);color:var(--paper-ink)}
.l-diary p{margin:0;color:var(--paper)}
.debug{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:2px dashed var(--edge)}
.debug input[type=range]{width:100%;accent-color:var(--sky)}
.jump{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.jump span{color:var(--muted)}
.log{gap:3px}
.l-day{color:var(--sky);text-align:center;margin-top:6px}
.l-take{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;margin-top:6px}
.l-take em{font-style:normal;color:var(--muted)}
.slate{background:var(--ink);color:var(--bg);padding:0 4px}
.l-dir{color:var(--sky)}
.l-beat{display:grid;grid-template-columns:36px 1fr;gap:6px}
.l-beat .who{text-align:right}
.l-beat .act{color:var(--muted)}
.l-act{color:var(--muted);padding-left:42px}
.l-note{color:var(--warn);padding-left:42px}
.l-res{color:var(--muted);padding-left:42px}
.l-sys{color:var(--sky)}
.l-acc{color:#ffd7d8;background:#3a1620;padding:2px 6px;margin-top:4px}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.clues li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.clues time{color:var(--muted)}
.clues .empty{display:block;color:var(--muted)}

/* 偷拍小窗：WebGL 直接画在 #crt-screen 的位置 */
.crt{position:absolute;z-index:2;left:var(--gut-l);bottom:var(--gut-b);padding:22px 0;background:transparent}
.crt-screen{width:240px;height:180px;position:relative;pointer-events:none}
.crt-screen::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.crt-top,.crt-bot{position:absolute;left:0;right:0;height:22px;padding:0 8px;background:#0d1322;display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.crt-top{top:0;color:var(--muted)}
.crt-bot{bottom:0}
.crt .rec{color:var(--tally)}

/* 镜头按钮 */
.cam{position:absolute;z-index:3;right:var(--gut-r);bottom:calc(var(--gut-b) + 24px);display:flex;gap:8px;padding:6px 8px}
.help{position:absolute;z-index:3;right:var(--gut-r);bottom:var(--gut-b);margin:0;color:var(--muted);text-shadow:0 1px 0 #000}

/* 手牌 */
.hand{position:absolute;z-index:3;left:50%;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.hand-note{background:var(--panel);padding:2px 8px;margin-bottom:10px;color:var(--muted);box-shadow:2px 0 0 0 var(--edge),-2px 0 0 0 var(--edge),0 2px 0 0 var(--edge),0 -2px 0 0 var(--edge)}
.hand-cards{display:flex;pointer-events:auto;min-height:40px}
.card{appearance:none;border:0;text-align:left;cursor:grab;touch-action:none;user-select:none;width:116px;height:156px;margin:0 -8px;padding:8px 9px;background:var(--paper);color:var(--paper-ink);display:flex;flex-direction:column;gap:3px;transform:translateY(66px) rotate(var(--r));transition:transform .18s steps(4);box-shadow:0 0 0 2px #2b2620,0 4px 0 2px rgba(0,0,0,.35)}
.card:hover:not(:disabled),.card:focus-visible,.card.armed{transform:translateY(0) rotate(0);z-index:2}
.card.armed{box-shadow:0 0 0 2px #2b2620,0 0 0 5px var(--sky)}
.card.lifted{opacity:.3}
.card:disabled{cursor:not-allowed;filter:grayscale(.6) brightness(.8)}
.card .stamp,.pop .stamp{align-self:flex-start;padding:0 4px;box-shadow:0 0 0 1px currentColor}
.card[data-cat="drama"] .stamp,.stamp[data-cat="drama"]{color:#b8325c}
.card[data-cat="calm"] .stamp,.stamp[data-cat="calm"]{color:#1d7f55}
.card[data-cat="block"] .stamp,.stamp[data-cat="block"]{color:#a35f00}
.card b{font-weight:400;padding-bottom:3px;border-bottom:2px solid rgba(214,92,92,.5)}
.card .d{color:var(--paper-muted);flex:1;overflow:hidden}
.card .meta,.card .cost{color:var(--paper-muted)}
.drag-ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;margin:0;opacity:.95;transition:none;transform-origin:50% 100%}

/* 跟着 3D 物体走的标签 */
.labels{position:absolute;inset:0;z-index:1;pointer-events:none}
.labels > *{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
.loc{pointer-events:auto;cursor:pointer;border:0;color:#fff;background:rgba(11,17,32,.72);padding:0 6px;margin:0;translate:-50% -100%;box-shadow:2px 0 0 0 rgba(255,255,255,.25),-2px 0 0 0 rgba(255,255,255,.25),0 2px 0 0 rgba(255,255,255,.25),0 -2px 0 0 rgba(255,255,255,.25)}
.loc:hover{background:var(--sky);color:var(--bg)}
.loc.exit{cursor:default;background:#151b28;color:var(--sky)}
.loc.acc{pointer-events:none;background:var(--tally);color:#fff}
.loc.ok{background:#173450;color:var(--sky);box-shadow:2px 0 0 0 var(--sky),-2px 0 0 0 var(--sky),0 2px 0 0 var(--sky),0 -2px 0 0 var(--sky);animation:pulse 1s steps(2,start) infinite}
.loc.dim{opacity:.3}
.loc.hot,.tag.star.hot{background:var(--sky);color:var(--bg);animation:none;padding:3px 10px;box-shadow:2px 0 0 0 #fff,-2px 0 0 0 #fff,0 2px 0 0 #fff,0 -2px 0 0 #fff}
.placing .tag:not(.star),.placing .bubble{opacity:.35}
.tag{translate:-50% -100%;padding:0 5px;background:rgba(11,17,32,.78);color:#fff;border-left:6px solid var(--c)}
.tag.star{background:var(--c);color:#141821;border:0;pointer-events:auto;cursor:pointer}
.tag.star.ok{box-shadow:0 0 0 2px var(--sky);animation:pulse 1s steps(2,start) infinite}
.tag.star.run{background:var(--tally);color:#fff}
.tag.inside{background:var(--panel);color:var(--sky);border-left:6px solid var(--sky);animation:pulse 1.6s steps(2,start) infinite}
.bubble{translate:-50% -100%;max-width:220px;white-space:normal;background:var(--paper);color:var(--paper-ink);padding:4px 8px;z-index:1;box-shadow:2px 0 0 0 #2b2620,-2px 0 0 0 #2b2620,0 2px 0 0 #2b2620,0 -2px 0 0 #2b2620}
.bubble::after{content:"";position:absolute;left:calc(50% - 4px);bottom:-8px;width:8px;height:6px;background:#2b2620}
.bubble.thought{background:#dfe9f7}
.pin{translate:-50% -100%;pointer-events:auto;display:flex;align-items:center;gap:6px;background:#1d1d24;color:#fff;padding:0 0 0 6px;box-shadow:2px 0 0 0 #fff,-2px 0 0 0 #fff,0 2px 0 0 #fff,0 -2px 0 0 #fff}
.pin small{color:var(--warn);font-size:12px}
.pin-x{border:0;background:#3a3a46;color:#fff;cursor:pointer;padding:0 6px}
.pin-x:hover{background:var(--tally)}

/* 放置小窗 */
.pop{position:absolute;z-index:15;width:300px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pop-head{display:flex;gap:8px;align-items:center}
.pop-head b{font-weight:400;font-size:24px;line-height:24px}
.pop p{margin:0}
.pop-desc,.pop-note,.pop-cost{color:var(--muted)}
.pop-where{color:var(--sky)}
.pop-where.warn{color:var(--warn)}
.pop-label{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.achip{appearance:none;border:0;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;background:var(--panel-2);color:var(--ink);cursor:pointer;box-shadow:0 0 0 2px var(--edge)}
.achip i{width:8px;height:8px;display:inline-block}
.achip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--sky);background:#173450}
.achip:disabled{opacity:.35;cursor:not-allowed}
.pop input[type=text],.pop input:not([type]){width:100%;background:var(--panel-2);border:0;padding:5px 8px;box-shadow:0 0 0 2px var(--edge);outline:none}
.pop input:not([type]):focus{box-shadow:0 0 0 2px var(--sky)}
.pop-sponsor{display:flex;gap:6px;align-items:flex-start;cursor:pointer}
.pop-sponsor input{accent-color:var(--sky);margin:3px 0 0}
.pop-btns{display:flex;justify-content:flex-end;gap:10px}

/* 最终幕 */
.finale{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(var(--gut-b) + 8px);width:min(520px,calc(100% - 2 * var(--gut-l)));padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.finale p{margin:0}
.finale .rec{color:var(--tally)}
.finale label{color:var(--muted)}
.finale textarea{width:100%;resize:none;background:var(--panel-2);border:0;padding:5px 8px;box-shadow:0 0 0 2px var(--edge);outline:none;font:inherit;color:inherit}
.finale textarea:focus{box-shadow:0 0 0 2px var(--sky)}
.finale .btns,.endbar{display:flex;justify-content:flex-end;gap:10px;align-items:center}
.endbar{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(var(--gut-b) + 8px);padding:8px 12px;max-width:calc(100% - 2 * var(--gut-l))}
.endbar span{margin-right:auto}
.finale-on .hand,.ended-on .hand,.finale-on .help,.ended-on .help{display:none}

/* 结局弹窗：牛皮纸卡片 + 像素边框 */
.overlay{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:var(--gut-t) var(--gut-r) var(--gut-b) var(--gut-l);background:rgba(8,12,20,.78)}
.end-card{width:min(460px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--paper-ink);padding:18px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:4px 0 0 0 #2b2620,-4px 0 0 0 #2b2620,0 4px 0 0 #2b2620,0 -4px 0 0 #2b2620,0 12px 0 4px rgba(0,0,0,.35)}
.end-card .eyebrow{color:var(--paper-muted);letter-spacing:.1em}
.end-head{display:flex;align-items:center;gap:12px}
.end-card h2{margin:0;font-weight:400;font-size:24px;line-height:24px}
.rank{font-size:24px;line-height:24px;padding:4px 8px;background:var(--tally);color:#fff}
.end-card p{margin:0}
.end-card dl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0;padding-top:10px;border-top:2px dashed rgba(43,38,32,.3)}
.end-card dt{color:var(--paper-muted)}
.end-card dd{margin:0}
.end-card .btns{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.end-card .pbtn{background:var(--paper);color:var(--paper-ink);box-shadow:2px 0 0 0 #2b2620,-2px 0 0 0 #2b2620,0 2px 0 0 #2b2620,0 -2px 0 0 #2b2620}
.end-card .pbtn.primary{background:#2b2620;color:var(--paper)}

.loading{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:var(--bg);color:var(--sky);font-size:24px;line-height:24px;text-align:center;padding:0 24px}

@media (max-width:760px){
  :root{--top-h:150px}
  .top{gap:6px 14px;padding:6px 10px}
  .stats{gap:12px}
  .stat b{font-size:12px;line-height:18px}
  .brand small,.crew #ai-status{display:none}
  .alert{max-width:calc(100% - 2 * var(--gut-l))}
  .drawer{width:min(290px,calc(100% - 70px));height:calc(100% - var(--top-h) - 230px)}
  .crt{bottom:calc(var(--gut-b) + 96px);padding:20px 0}
  .crt-screen{width:144px;height:108px}
  .crt-top{display:none}
  .cam{bottom:auto;right:auto;left:var(--gut-l);top:calc(var(--gut-t) + var(--top-h) + 40px);flex-direction:column;padding:6px}
  .cam #follow,.cam #overview{writing-mode:vertical-rl;padding:8px 3px}
  .help,.hand-note{display:none}
  .card{width:84px;height:120px;padding:6px;transform:translateY(60px) rotate(var(--r))}
  .card .d,.card .meta{display:none}
  .toast{bottom:140px}
  .end-card dl{grid-template-columns:repeat(3,minmax(0,1fr))}
  .finale-on .crt,.ended-on .crt{display:none}
  .pop{left:var(--gut-l)!important;right:var(--gut-r);width:auto;top:auto!important;bottom:calc(var(--gut-b) + 8px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.danmu{display:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="view" aria-label="晴港镇的 3D 俯视画面，可以拖动、缩放和旋转"></canvas>
  <div class="labels" id="labels"></div>
  <div class="danmu" id="danmu" aria-hidden="true"></div>

  <header class="top px">
    <div class="brand">
      <span class="logo">真实人生</span>
      <span class="onair">ON AIR</span>
      <small id="showday">直播第 12,410 天</small>
      <a class="back" href="./">2D 版</a>
    </div>
    <div class="clock"><b id="clock-day">第 1 天</b><b id="clock-time">06:35</b><span class="chip" id="clock-period">早上</span></div>
    <div class="speed" role="group" aria-label="时间速度">
      <button class="pbtn" type="button" data-speed="0" aria-pressed="false">暂停</button>
      <button class="pbtn" type="button" data-speed="1" aria-pressed="true">1x</button>
      <button class="pbtn" type="button" data-speed="2" aria-pressed="false">2x</button>
      <button class="pbtn" type="button" data-speed="4" aria-pressed="false">4x</button>
    </div>
    <div class="stats">
      <div class="stat"><span>收视</span><b><span id="rate">820</span><small>万</small><svg id="spark" width="64" height="22" viewBox="0 0 64 22" aria-hidden="true"></svg></b></div>
      <div class="stat"><span>怀疑值</span><b><span id="sus-val">12</span><i class="bar" aria-hidden="true"><b id="sus-bar"></b></i></b></div>
      <div class="stat"><span>经费</span><b><span id="budget">300</span><small>万</small></b></div>
    </div>
    <div class="crew">
      <div class="crew-row">
        <select id="crew" aria-label="导演组">
          <option value="quick">AI · 快速</option>
          <option value="default">AI · 精细（较慢）</option>
          <option value="offline">排练（不用 AI）</option>
        </select>
        <button class="pbtn" id="restart" type="button">重开</button>
      </div>
      <span id="ai-status">正在连接 AI…</span>
    </div>
  </header>

  <p class="alert" id="alert-esc" hidden></p>

  <div class="shoot px" id="shoot" hidden aria-live="polite">
    <span class="rec">● 拍摄中</span>
    <span id="shoot-title"></span>
    <span class="btns">
      <button class="pbtn" id="skip" type="button">快进</button>
      <button class="pbtn" id="cut" type="button" hidden>喊卡</button>
    </span>
    <p id="shoot-cap"></p>
  </div>

  <aside class="drawer px" id="drawer">
    <button class="pbtn drawer-tab" id="drawer-tab" type="button" aria-expanded="false" aria-controls="drawer-body">导演笔记</button>
    <div class="drawer-body" id="drawer-body">
      <div class="tabs" role="tablist">
        <button class="pbtn" type="button" role="tab" data-tab="truman" aria-selected="true">林楚</button>
        <button class="pbtn" type="button" role="tab" data-tab="log" aria-selected="false">场记 <small id="tab-log-n"></small></button>
        <button class="pbtn" type="button" role="tab" data-tab="clues" aria-selected="false">破绽 <small id="tab-clue-n"></small></button>
      </div>

      <div class="panel" role="tabpanel" data-tab="truman">
        <dl class="now"><dt>位置</dt><dd id="t-place">家</dd><dt>正在</dt><dd id="t-act">睡觉</dd><dt>下一站</dt><dd id="t-next">—</dd><dt>打算</dt><dd id="t-intent">—</dd></dl>
        <h3>内心 <span id="t-mind-d"></span></h3>
        <p class="mind" id="t-mind"></p>
        <h3>日记 <span id="t-diary-d"></span></h3>
        <p class="diary" id="t-diary"></p>
        <h3>今日日程</h3>
        <ol class="sched" id="t-sched"></ol>
        <div class="debug">
          <h3>调试 <span>正式版没有</span></h3>
          <label for="dbg-sus">怀疑值 <span id="dbg-sus-v">12</span>：拖高看穹顶裂开</label>
          <input type="range" id="dbg-sus" min="0" max="100" value="12">
          <div class="jump"><span>跳到</span>
            <button class="pbtn" type="button" data-jump="390">06:30</button>
            <button class="pbtn" type="button" data-jump="710">11:50</button>
            <button class="pbtn" type="button" data-jump="1110">18:30</button>
            <button class="pbtn" type="button" data-jump="1210">20:10</button>
          </div>
        </div>
      </div>

      <div class="panel log" role="tabpanel" data-tab="log" id="log" hidden aria-live="polite"></div>

      <div class="panel" role="tabpanel" data-tab="clues" hidden>
        <ul class="clues" id="clues"></ul>
      </div>
    </div>
  </aside>

  <div class="crt px">
    <div class="crt-top"><span id="crt-cam">CAM</span></div>
    <div class="crt-screen" id="crt-screen"></div>
    <div class="crt-bot"><span class="rec">● REC</span><span id="crt-tc">06:35:00</span></div>
  </div>

  <div class="cam px">
    <button class="pbtn" id="rot-l" type="button" title="向左转（Q）" aria-label="向左转">↺</button>
    <button class="pbtn" id="rot-r" type="button" title="向右转（E）" aria-label="向右转">↻</button>
    <button class="pbtn" id="zoom-out" type="button" aria-label="缩小">－</button>
    <button class="pbtn" id="zoom-in" type="button" aria-label="放大">＋</button>
    <button class="pbtn" id="follow" type="button" aria-pressed="true" title="跟拍林楚（F）">跟拍林楚</button>
    <button class="pbtn" id="overview" type="button">全景</button>
  </div>
  <p class="help">拖动平移 · 滚轮缩放 · Q/E 旋转 · 空格暂停</p>

  <div class="hand">
    <span class="hand-note" id="hand-note"></span>
    <div class="hand-cards" id="hand-cards"></div>
  </div>

  <p class="toast" id="toast" hidden role="status"></p>
  <div class="pop px" id="pop" role="dialog" aria-label="安排这场戏" hidden></div>

  <div class="finale px" id="finale" hidden role="group" aria-labelledby="finale-title">
    <p id="finale-title"><span class="rec">● 最终幕</span> 林楚站在穹顶的出口门前。全世界都在看。</p>
    <label for="finale-words">这是你第一次直接对他说话。你想说什么？</label>
    <textarea id="finale-words" rows="3" maxlength="200" placeholder="例：外面的世界没有比这里更真实的东西。留下来吧，我比任何人都了解你。"></textarea>
    <div class="btns">
      <button class="pbtn" id="finale-silent" type="button">保持沉默</button>
      <button class="pbtn primary" id="finale-go" type="button">对他说话</button>
    </div>
  </div>
  <div class="endbar px" id="endbar" hidden>
    <span id="endbar-t"></span>
    <button class="pbtn" id="endbar-show" type="button">看结局</button>
    <button class="pbtn primary" id="endbar-restart" type="button">重新开播</button>
  </div>
  <div class="overlay" id="overlay" hidden>
    <div class="end-card" role="dialog" aria-modal="true" aria-labelledby="end-title">
      <span class="eyebrow" id="end-eyebrow"></span>
      <div class="end-head"><span class="rank" id="end-rank" hidden></span><h2 id="end-title"></h2></div>
      <p id="end-text"></p>
      <dl id="end-stats"></dl>
      <div class="btns">
        <button class="pbtn" id="end-log" type="button">看看场记</button>
        <button class="pbtn primary" id="end-restart" type="button">重新开播</button>
      </div>
    </div>
  </div>

  <div class="loading" id="loading">搭建摄影棚…</div>
</div>
<script>
  setTimeout(function () {
    if (!window.__booted) document.getElementById('loading').textContent = '3D 引擎没加载出来。用 npm start 启动后再打开，并确认浏览器支持 WebGL。';
  }, 20000);
</script>
<script type="module" src="game/main.js"></script>
</body>
</html>
