<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>真实人生 · 2D</title>
<link rel="stylesheet" href="fonts/Fusion-Pixel-12px-Proportional-Simplified-Chinese.css">
<style>
/* Layout: a TV control room. Live monitor + director's console on the left; the subject's inner voice, clues and the script log on the right. Single dark theme by choice: the booth is always dark, the fake town glows inside the monitor. */
:root{
  --room:#121a29;
  --panel:#19233a;
  --panel-2:#212d45;
  --line:#2c3b58;
  --ink:#e8edf7;
  --muted:#8f9cb7;
  --sky:#8fd3ff;
  --tally:#ff4d4f;
  --paper:#f3ead3;
  --paper-ink:#2b2620;
  --paper-muted:#6b6358;
  --warn:#ffb648;
  --calm:#6fd6a8;
  --f-display:"Fusion Pixel 12px Proportional Simplified Chinese","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-serif:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--room);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

.app{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}

/* header */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.logo{font-family:var(--f-display);font-size:36px;line-height:1;letter-spacing:.04em;color:var(--sky);-webkit-font-smoothing:none}
.to3d{font-family:var(--f-display);font-size:12px;color:var(--sky);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.to3d:hover{border-color:var(--sky)}
.brand-sub{display:flex;flex-direction:column;line-height:1.3}
.brand-sub small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted)}
.tally{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:600;font-size:11px;letter-spacing:.16em;color:#fff;background:var(--tally);padding:2px 8px;border-radius:4px;box-shadow:0 0 14px rgba(255,77,79,.5);align-self:flex-start}
.tally i{width:7px;height:7px;border-radius:50%;background:#fff}
body.shooting .tally{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6;box-shadow:0 0 3px rgba(255,77,79,.2)}}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat .k{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;display:flex;align-items:center;gap:8px;white-space:nowrap}
.stat .v small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.gauge{position:relative;width:96px;height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--calm);transition:width .6s ease,background-color .6s ease}
.gauge i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.28)}
.spark{display:block}
.crew{display:flex;flex-direction:column;gap:2px;min-width:0}
.crew-row{display:flex;gap:6px;align-items:center}
.crew select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:13px}
#crew-status{font-size:11px;color:var(--muted);max-width:220px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--ink)}
.ghost:hover{border-color:var(--sky)}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
.col-l,.col-r{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;-webkit-font-smoothing:none;letter-spacing:.05em;display:flex;align-items:baseline;gap:10px;line-height:1.2}
.panel h2 small{font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.02em}

/* monitor */
.monitor{position:relative;border-radius:14px;overflow:hidden;background:#0a0e17;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.monitor canvas{display:block;width:100%;aspect-ratio:16/9;max-width:100%}
.monitor .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(6,9,16,.72) 100%)}
.monitor .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)}
.osd{position:absolute;font-family:var(--f-mono);font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.osd.tl{top:10px;left:12px}
.osd.tr{top:10px;right:12px;font-variant-numeric:tabular-nums}
.rec{width:8px;height:8px;border-radius:50%;background:var(--tally);animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.subtitle{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:88%;text-align:center;background:rgba(9,13,22,.74);padding:5px 12px;border-radius:6px;font-size:clamp(12.5px,1.5vw,16px);line-height:1.5}
.subtitle i{font-style:normal;color:#c9d2e3}
.danmu{position:absolute;left:0;right:0;top:34px;height:42%;pointer-events:none;overflow:hidden}
.danmu span{position:absolute;left:100%;white-space:nowrap;color:#fff;font-weight:500;font-size:clamp(12px,1.4vw,15px);text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.5)}

/* console */
.console-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.console-head .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.alert{border-radius:8px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:baseline;line-height:1.55}
.alert .tag{flex:none;font-size:11px;font-weight:700;letter-spacing:.1em;padding:1px 6px;border-radius:3px}
.alert.acc{background:rgba(255,182,72,.1);border:1px solid rgba(255,182,72,.42)}
.alert.acc .tag{background:var(--warn);color:#2b1d00}
.alert.esc{background:rgba(255,77,79,.1);border:1px solid rgba(255,77,79,.45)}
.alert.esc .tag{background:var(--tally);color:#fff}
.step{display:flex;flex-direction:column;gap:8px}
.step-k{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.step-k b{font-family:var(--f-mono);color:var(--sky);margin-right:6px;font-weight:600}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{appearance:none;border:0;text-align:left;cursor:pointer;background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:10px 11px 9px;display:flex;flex-direction:column;gap:5px;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .15s ease,box-shadow .15s ease;min-width:0}
.card:hover:not(:disabled){transform:translateY(-2px)}
.card[aria-pressed="true"]{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 0 0 3px var(--sky),0 8px 18px rgba(0,0,0,.4)}
.card:disabled{opacity:.42;cursor:not-allowed}
.card .stamp{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.14em;padding:0 5px;border:1.5px solid currentColor;border-radius:3px;transform:rotate(-3deg)}
.card[data-cat="drama"] .stamp{color:#b8325c}
.card[data-cat="calm"] .stamp{color:#1d7f55}
.card[data-cat="block"] .stamp{color:#a35f00}
.card .t{font-weight:700;font-size:15px;line-height:1.35;padding-bottom:4px;border-bottom:1.5px solid rgba(214,92,92,.5)}
.card .d{font-size:12px;line-height:1.55;color:var(--paper-muted);flex:1}
.card .meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11px;color:var(--paper-muted);font-variant-numeric:tabular-nums}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:13px;color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip small{color:var(--muted);font-size:11px}
.chip[aria-pressed="true"]{border-color:var(--sky);background:rgba(143,211,255,.14)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.actor-note{font-size:12px;color:var(--muted);margin:0}

.whisper{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.whisper:focus-within{border-color:var(--sky)}
.whisper .tag{flex:none;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--sky)}
.whisper input{flex:1;min-width:0;background:transparent;border:0;padding:9px 0;outline:none}
.whisper input::placeholder,textarea::placeholder{color:#64708a}

.action{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between}
.sponsor{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;min-width:0}
.sponsor input{accent-color:var(--sky);width:16px;height:16px;flex:none}
.sponsor em{font-style:normal;color:var(--calm);font-family:var(--f-mono);font-size:12px}
.btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.go{border:0;cursor:pointer;font-family:var(--f-display);font-size:24px;-webkit-font-smoothing:none;letter-spacing:.2em;padding:7px 20px 7px 50px;border-radius:8px;color:#0d1522;background:var(--sky);position:relative;overflow:hidden;line-height:1.3}
.go::before{content:"";position:absolute;left:0;top:0;bottom:0;width:34px;background:repeating-linear-gradient(135deg,#0d1522 0 7px,var(--paper) 7px 14px)}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go:disabled{opacity:.5;cursor:wait}
.hint{margin:0;font-size:12.5px;color:var(--muted);min-height:1.6em}
.hint.bad{color:var(--warn)}
textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;resize:vertical;outline:none;line-height:1.6}
textarea:focus{border-color:var(--sky)}

/* right column */
.mind blockquote{margin:0;font-family:var(--f-serif);font-size:17px;line-height:1.85;color:var(--paper);text-wrap:pretty}
.mind .stamp-d{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.older{display:flex;flex-direction:column;gap:6px}
.older p{margin:0;font-family:var(--f-serif);font-size:13px;line-height:1.7;color:var(--muted)}
.intent{display:flex;gap:10px;align-items:baseline;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px}
.intent span{color:var(--muted);flex:none;font-size:12px}
.intent.esc b{color:var(--tally)}
.clues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.clues li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:13px;align-items:baseline}
.clues time{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.empty{font-size:13px;color:var(--muted);margin:0}
.log-body{max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding-right:4px;font-size:13.5px}
.l-day{display:flex;align-items:center;gap:10px;color:var(--sky);font-family:var(--f-display);font-size:24px;margin-top:6px;-webkit-font-smoothing:none}
.l-day::before,.l-day::after{content:"";flex:1;height:1px;background:var(--line)}
.l-take{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:8px;font-weight:700}
.l-take em{font-style:normal;color:var(--muted);font-weight:400}
.slate{font-family:var(--f-mono);font-size:11px;padding:0 6px;border-radius:2px;background:var(--ink);color:var(--room);font-weight:600}
.l-dir{font-size:12px;color:var(--sky);opacity:.8}
.l-beat{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:8px}
.l-beat .who{color:var(--c,var(--muted));font-weight:700;text-align:right}
.l-beat .act{color:var(--muted);font-size:12.5px}
.l-act{color:var(--muted);font-size:13px;padding-left:calc(4.2em + 8px)}
.l-note{font-size:12.5px;color:var(--warn);padding-left:calc(4.2em + 8px)}
.l-res{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-left:calc(4.2em + 8px);font-variant-numeric:tabular-nums}
.l-sys{font-size:12.5px;color:var(--sky)}

/* ending */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,12,20,.8);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.end-card{max-width:540px;width:100%;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:26px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.end-card .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--paper-muted)}
.end-card h2{font-family:var(--f-display);font-weight:400;font-size:36px;margin:0;line-height:1.15;text-wrap:balance}
.end-card p{margin:0;font-family:var(--f-serif);font-size:15px;line-height:1.85}
.end-card dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 0;padding-top:12px;border-top:1px solid rgba(43,38,32,.15)}
.end-card dt{font-size:11px;color:var(--paper-muted)}
.end-card dd{margin:0;font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.end-card .btns{margin-top:4px}
.end-card button{border-radius:6px;padding:8px 16px;cursor:pointer;border:1px solid rgba(43,38,32,.3);background:transparent;color:var(--paper-ink)}
.end-card button.primary{background:#0d1522;color:var(--paper);border-color:#0d1522}

@media (max-width:980px){
  .stage{display:flex;flex-direction:column;align-items:stretch}
  .subtitle{bottom:8px;max-width:94%;padding:4px 10px}
  .col-l,.col-r{display:contents}
  .monitor{order:1}.mind{order:2}.console{order:3}.clues-p{order:4}.log-p{order:5}
  .log-body{max-height:360px}
}
@media (max-width:720px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .logo{font-size:26px}
  .end-card dl{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .danmu{display:none}
}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="brand">
      <span class="logo">真实人生</span>
      <div class="brand-sub">
        <span class="tally"><i></i>ON AIR</span>
        <small id="showday">直播第 12,410 天</small>
      </div>
      <a class="to3d" href="./">3D 版 →</a>
    </div>
    <div class="stat"><span class="k">本季进度</span><span class="v" id="when">第 1/7 天 · 早上</span></div>
    <div class="stat"><span class="k">收视</span><span class="v"><span id="rate">820</span><small>万</small><svg class="spark" id="spark" width="64" height="22" viewBox="0 0 64 22" aria-hidden="true"></svg></span></div>
    <div class="stat"><span class="k">林楚的怀疑值</span><span class="v"><span id="sus">12</span><span class="gauge" aria-hidden="true"><b id="sus-bar"></b><i style="left:30%"></i><i style="left:60%"></i><i style="left:85%"></i></span></span></div>
    <div class="stat"><span class="k">经费</span><span class="v"><span id="budget">300</span><small>万</small></span></div>
    <div class="crew">
      <label class="k" for="crew" style="font-size:11px;letter-spacing:.12em;color:var(--muted)">导演组</label>
      <div class="crew-row">
        <select id="crew">
          <option value="quick">AI · 快速</option>
          <option value="default">AI · 精细（较慢）</option>
          <option value="offline">排练（不用 AI）</option>
        </select>
        <button class="ghost" id="restart-top" type="button">重开</button>
      </div>
      <span id="crew-status">正在连接 AI…</span>
    </div>
  </header>

  <main class="stage">
    <div class="col-l">
      <div class="monitor" id="monitor">
        <canvas id="town" aria-label="晴港镇实时画面"></canvas>
        <div class="vig"></div>
        <div class="scan"></div>
        <div class="osd tl" id="cam">CAM 07 · 床头闹钟摄像头</div>
        <div class="osd tr"><i class="rec"></i>REC <span id="tc">07:30:00</span></div>
        <div class="danmu" id="danmu"></div>
        <div class="subtitle" id="subtitle" hidden></div>
      </div>

      <section class="panel console" id="console">
        <div class="console-head">
          <h2>导演台</h2>
          <span class="when" id="slot-info">下一场：第 1 天 · 早上</span>
        </div>

        <div id="normal-console" class="step" style="gap:14px">
          <div class="alert acc" id="alert-acc" hidden><span class="tag">突发</span><span id="acc-text"></span></div>
          <div class="alert esc" id="alert-esc" hidden><span class="tag">警报</span><span id="esc-text"></span></div>

          <div class="step">
            <div class="step-k"><b>1</b>选一张事件卡</div>
            <div class="cards" id="cards"></div>
          </div>
          <div class="step">
            <div class="step-k"><b>2</b>派谁上场</div>
            <div class="chips" id="actors"></div>
            <p class="actor-note" id="actor-note"></p>
          </div>
          <div class="step">
            <label class="step-k" for="whisper"><b>3</b>耳麦指令（可选。演员会照做……尽量）</label>
            <div class="whisper"><span class="tag">耳麦</span><input id="whisper" maxlength="80" autocomplete="off" placeholder="例：让她不经意提起，下周要去外地出差"></div>
          </div>
          <div class="action">
            <label class="sponsor" for="sponsor"><input type="checkbox" id="sponsor"><span>植入今日赞助：<b id="sp-name">晴天速溶咖啡</b> <em>+40 万</em></span></label>
            <div class="btns">
              <button class="ghost" id="cut" type="button" hidden>喊卡</button>
              <button class="ghost" id="skip" type="button" hidden>快进</button>
              <button class="go" id="go" type="button">开拍</button>
            </div>
          </div>
        </div>

        <div id="finale-console" class="step" hidden>
          <div class="alert esc"><span class="tag">最终幕</span><span>林楚站在天空尽头的那扇门前。这是你唯一一次可以直接对他说话，他会听见天上传来的声音。</span></div>
          <label class="step-k" for="finale-words">你想对他说什么？</label>
          <textarea id="finale-words" rows="3" maxlength="200" placeholder="例：外面的世界没有比这里更真实的东西。留下来吧，我比任何人都了解你。"></textarea>
          <div class="action">
            <span class="hint">他会不会留下，取决于你说的话能不能打动他。</span>
            <div class="btns">
              <button class="ghost" id="finale-silent" type="button">保持沉默</button>
              <button class="go" id="finale-go" type="button">对他说话</button>
            </div>
          </div>
        </div>

        <div id="ended-console" class="step" hidden>
          <p class="hint" id="ended-text">本季已经结束。</p>
          <div class="btns"><button class="ghost" id="show-ending" type="button">查看结局</button><button class="go" id="restart-end" type="button">重新开播</button></div>
        </div>

        <p class="hint" id="hint"></p>
      </section>
    </div>

    <div class="col-r">
      <section class="panel mind">
        <h2>林楚的内心 <small>只有导演听得到</small></h2>
        <span class="stamp-d" id="mind-d"></span>

function riskHint(r) {
  return r <= -2 ? '这是安抚戏，演得好能明显降低怀疑' : r < 0 ? '偏温和，略能降低怀疑' : r === 0 ? '很安全' : r <= 2 ? '有点巧合，可能引起注意' : '风险很高，很容易露馅';
}

function stateBlock(day, slot) {
  const L = [];
  L.push(`【当前状态】第${day}天·${SLOTS[slot]}。林楚的怀疑值 ${state.suspicion}/100（0=深信不疑，100=确信世界是假的）。`);
  L.push(`林楚的打算：${state.intent || '无'}`);
  L.push(`他之前注意到的破绽：${state.clues.slice(-6).map(c => c.t).join('；') || '暂无'}`);
  L.push(`最近发生的事：${state.memos.slice(-6).join('；') || '这是第一场戏'}`);
  return L.join('\n');
}

function buildPrompt(ctx) {
  const L = ['你是互动游戏《真实人生》的剧情引擎。玩家扮演一档24小时直播真人秀的导演，你负责根据导演的安排写出这一场戏。', BIBLE, stateBlock(ctx.day, ctx.slot)];
  if (ctx.escapeBefore) {
    L.push(ctx.card.cat === 'block'
      ? '注意：林楚上一场决定离开晴港，导演这一场用阻拦事件拦他。他可能被拦住，也可能因此更起疑。'
      : '注意：林楚上一场决定离开晴港，导演这一场没有阻拦。描写他朝大桥或码头前进，离出口更近了。');
  }
  L.push('【导演对这场戏的安排】');
  L.push(`事件：${ctx.card.t}——${ctx.card.d}`);
  L.push(`派出演员：${ctx.actor ? `${ctx.actor}（${CAST[ctx.actor].role}）` : '无，只有群演'}`);
  L.push(`耳麦指令：${ctx.whisper ? `「${ctx.whisper}」（导演悄悄告诉演员的话。演员会尽力执行，但可能演得生硬，或按自己的私心发挥）` : '无'}`);
  L.push(`植入广告：${ctx.sponsor ? `${ctx.sponsor.n}，广告词「${ctx.sponsor.s}」。演员必须在戏里生硬地念出来，这是笑点。` : '无'}`);
  L.push(`突发舞台事故：${ctx.accident ? `${ctx.accident.t}（演员们得临场圆过去）` : '无'}`);
  L.push(`本场事件的风险提示：${riskHint(ctx.card.risk)}`);
  L.push(RULES);
  return L.join('\n');
}

function step(p, dt, speed) {
  const d = p.tx - p.x;
  if (Math.abs(d) < 1) { p.x = p.tx; p.walking = false; return; }
  p.x += Math.sign(d) * Math.min(Math.abs(d), speed * dt);

function drawAccident(now) {
  const t = (now - view.accT0) / 1000;
  const x = view.tr.x, gy = groundY(x);
  if (view.acc === 'rain') {
    const top = gy - 230;
    g.fillStyle = 'rgba(110,120,140,.92)'; ellipse(x, top, 46, 16); ellipse(x - 24, top + 6, 26, 12); ellipse(x + 26, top + 4, 28, 12);
    g.strokeStyle = 'rgba(170,200,240,.9)'; g.lineWidth = 2;
    const span = gy - 92 - (top + 14);
    for (let i = 0; i < 16; i++) {
      const rx = x - 34 + (i * 37) % 68;
      const ry = top + 14 + ((REDUCED ? i * 31 : now / 3 + i * 53) % span);
      g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx - 2, ry + 12); g.stroke();
    }
  } else if (view.acc === 'light') {
    const lx = view.tr.tx + 48, ly = groundY(lx);
    const fall = REDUCED ? 1 : Math.min(1, t / 1.1);
    const y = -40 + (ly + 30) * fall * fall;
    g.save(); g.translate(lx, y - 12); g.rotate(fall < 1 ? t * 4 : 1.25);
    g.fillStyle = '#3b3542'; rr(-18, -12, 36, 24, 4); g.fill();
    g.fillStyle = '#ffe9a8'; circle(18, 0, 9);
    g.fillStyle = '#ffffff'; g.font = `700 11px ${CF}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('7', -4, 0);
    g.restore();
    if (fall >= 1) { g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2; for (let i = 0; i < 5; i++) { const a = i * 1.2; g.beginPath(); g.moveTo(lx + Math.cos(a) * 26, ly - 6); g.lineTo(lx + Math.cos(a) * 36, ly - 10 - i * 2); g.stroke(); } }
  } else if (view.acc === 'radio') {
    for (let i = 0; i < 3; i++) {
      const r = (((REDUCED ? i / 3 : now / 700 + i / 3)) % 1) * 60;
      g.strokeStyle = `rgba(255,255,255,${(1 - r / 60).toFixed(2)})`; g.lineWidth = 2.5;
      g.beginPath(); g.arc(x + 24, gy - 64, r + 6, -0.9, 0.9); g.stroke();
    }
    g.fillStyle = '#3b3542'; rr(x + 12, gy - 72, 16, 12, 2); g.fill();
  } else if (view.acc === 'door') {
    const dx = clamp(view.tr.x + 150, 80, 1500);
    g.fillStyle = 'rgba(255,231,168,.95)'; g.fillRect(dx, 440, 58, 80);
    g.fillStyle = '#8a6b4a'; g.fillRect(dx + 8, 498, 42, 6);
    g.fillStyle = '#3b3542'; circle(dx + 20, 478, 6); g.fillRect(dx + 15, 484, 10, 14);
    g.fillStyle = '#ffffff'; g.fillRect(dx + 32, 494, 12, 4);
    g.strokeStyle = '#55627a'; g.lineWidth = 2; g.strokeRect(dx, 440, 58, 80);
    g.fillStyle = '#ffffff'; g.font = `700 11px ${CF}`; g.textAlign = 'center'; g.fillText('后台', dx + 29, 432);
  }
}

function draw(now) {
  const sk = SKY[view.slot] || SKY[0];
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#0a0e17'; g.fillRect(0, 0, CW, CH);
  const S = CW / 1600, z = view.zoom;
  const hw = 800 / z, hh = 450 / z;
  const cx = clamp(view.camX, hw, 1600 - hw), cy = clamp(view.camY, hh, 900 - hh);
  g.setTransform(S * z, 0, 0, S * z, CW / 2 - cx * S * z, CH / 2 - cy * S * z);
  drawSky(sk, now);
  drawSea(sk, now);
  drawLand(sk);
  const lit = view.slot === 2;
  drawHome(PX.家, lit); drawKiosk(PX.报刊亭); drawOffice(PX.保险公司, lit); drawPlaza(PX.广场); drawTavern(PX.小酒馆); drawBeach(PX.海滩); drawPier(); drawBridge(now);
  if (view.finale) drawWall(now);
  if (view.slot === 2) { g.fillStyle = 'rgba(40,30,90,.16)'; g.fillRect(0, 0, 1600, 900); }
  for (const e of view.extras) { person(e.x, 742, e.c, e.ph, e.walking, .9); if (e.stroller) drawPram(e.x, 742, Math.sign(e.tx - e.x) || 1); }
  // spotlight: the camera never leaves him
  const ty = groundY(view.tr.x);
  g.fillStyle = 'rgba(255,255,255,.22)'; ellipse(view.tr.x, ty + 2, 38, 9);
  for (const name in view.cast) { const c = view.cast[name]; person(c.x, groundY(c.x), CAST[name].color, c.ph, c.walking, 1); }
  const ta = view.leaving && view.tr.x > 1550 ? clamp(1 - (view.tr.x - 1550) / 30, 0, 1) : 1;
  person(view.tr.x, ty, CAST.林楚.color, view.tr.ph, view.tr.walking, 1.06, ta);
  drawAccident(now);
  for (const name in view.cast) { const c = view.cast[name]; nameTag(c.x, groundY(c.x), name, CAST[name].color, view.speaker === name, now); }
  if (ta > .3) nameTag(view.tr.x, ty, '林楚', CAST.林楚.color, view.speaker === '林楚', now);
  drawLabels();
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(60, now - lastT) / 1000; lastT = now;
  if (state) { update(dt, now); draw(now); }
  requestAnimationFrame(frame);
}

function selectCard(id, silent) {
  const c = CARD[id]; if (!c) return;
  state.sel.card = id;
  state.sel.actor = c.actor && actorAvailable(c.actor) ? c.actor : null;
  if (!silent) { save(); renderConsole(); }
}

function renderConsole() {
  const ended = !!state.ended, fin = !ended && state.finale;
  $('#normal-console').hidden = ended || fin;
  $('#finale-console').hidden = !fin;
  $('#ended-console').hidden = !ended;
  $('#slot-info').textContent = ended ? '本季已结束' : fin ? '最终幕' : `下一场：第 ${state.day} 天 · ${SLOTS[state.slot]}`;
  $('#finale-go').disabled = busy; $('#finale-silent').disabled = busy;
  if (ended) { $('#ended-text').textContent = `本季结局：${ENDINGS[state.ended.type].title}。`; return; }
  if (fin) return;

  const acc = state.accident && ACC[state.accident];
  $('#alert-acc').hidden = !acc;
  if (acc) $('#acc-text').textContent = `${acc.t}。不管你安排什么，这一场都会出这个事故。`;
  $('#alert-esc').hidden = !state.pendingEscape;
  if (state.pendingEscape) $('#esc-text').textContent = `林楚打算离开晴港（${state.intent}）。这一场不出阻拦卡，怀疑值额外 +15。`;

  const box = $('#cards'); box.replaceChildren();
  for (const id of state.hand) {
    const c = CARD[id]; if (!c) continue;
    const b = el('button', 'card'); b.type = 'button'; b.dataset.cat = c.cat;
    b.setAttribute('aria-pressed', String(state.sel.card === id));
    b.disabled = busy || c.cost > state.budget;
    const n = Math.ceil(c.drama / 2);
    const meta = el('span', 'meta');
    meta.append(el('span', '', `收视 ${'●'.repeat(n)}${'○'.repeat(5 - n)}`),
      el('span', '', c.risk > 0 ? `风险 ${'▲'.repeat(c.risk)}` : c.risk < 0 ? `降疑 ${'▼'.repeat(-c.risk)}` : '风险 —'),
      el('span', '', c.cost ? `${c.cost} 万` : '免费'));
    b.append(el('span', 'stamp', CAT[c.cat]), el('span', 't', c.t), el('span', 'd', c.d), meta);
    b.addEventListener('click', () => selectCard(id));
    box.append(b);
  }

  const card = CARD[state.sel.card];
  const chips = $('#actors'); chips.replaceChildren();
  const names = ['苏梅', '老周', '林母', '小雨', '孙伯'].concat(state.flags.dad ? ['林父'] : []).concat([null]);
  for (const name of names) {
    const b = el('button', 'chip'); b.type = 'button';
    const avail = name ? actorAvailable(name) : true;
    const pressed = card && card.lock ? card.actor === name : state.sel.actor === name;
    b.setAttribute('aria-pressed', String(pressed));
    b.disabled = busy || !avail || !!(card && card.lock && card.actor !== name);
    const dot = el('i'); dot.style.setProperty('--c', name ? CAST[name].color : '#8f9cb7');
    b.append(dot, el('span', '', name || '只用群演'));
    if (name) b.append(el('small', '', avail ? CAST[name].role : '还没回镇'));
    b.addEventListener('click', () => { state.sel.actor = name; save(); renderConsole(); });
    chips.append(b);
  }
  const who = card && card.lock ? card.actor : state.sel.actor;
  $('#actor-note').textContent = who ? `演员档案 · ${who}：${CAST[who].note}` : '群演只会按路线走来走去，不会主动推动剧情。';
  if (card && card.lock) $('#actor-note').textContent += '（这张卡指定了演员）';

  const w = $('#whisper');
  if (document.activeElement !== w) w.value = state.sel.whisper;
  w.disabled = busy;
  $('#sponsor').checked = !!state.sel.sponsor; $('#sponsor').disabled = busy;
  $('#sp-name').textContent = sponsorToday().n;
  const go = $('#go');
  go.disabled = busy || !card || card.cost > state.budget;
  go.textContent = busy ? '拍摄中' : '开拍';
  $('#cut').hidden = !inFlight;
  $('#skip').hidden = !busy || inFlight;
  if (!busy && !hintLock) {
    const parts = [];
    if (card) parts.push(card.cost ? `花费 ${card.cost} 万` : '不花钱');
    if (state.sel.sponsor) parts.push(`赞助 +${SPONSOR_PAY} 万`);
    if (effectiveMode() === 'default') parts.push('精细模式会先思考，每场要等半分钟左右');

}

      sp.style.top = `${4 + (i % 4) * 24}px`;

      const dist = box.clientWidth + sp.offsetWidth + 24;
      const a = sp.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${-dist}px)` }], { duration: 7000 + Math.random() * 3000, easing: 'linear' });
      a.onfinish = () => sp.remove();
    }, i * 650 + Math.random() * 400);
  });
}

/* ---------- engines ---------- */
function parseLine(line, onObj) {
  let s = line.trim(); if (!s) return;
  s = s.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  if (s.startsWith('[')) { try { const a = JSON.parse(s); if (Array.isArray(a)) a.forEach(onObj); } catch (e) { /* skip */ } return; }
  const i = s.indexOf('{'), j = s.lastIndexOf('}');
  if (i < 0 || j <= i) return;
  try { onObj(JSON.parse(s.slice(i, j + 1))); } catch (e) { /* skip malformed line */ }
}

async function callAI(prompt, onObj, tier) {
  let pending = '';
  ctl = new AbortController();
  inFlight = true; renderConsole();
  try {
    await sample(prompt, {
      modelTier: tier, cache: false, signal: ctl.signal,
      onText: ({ delta }) => { const parts = (pending + delta).split('\n'); pending = parts.pop(); parts.forEach(l => parseLine(l, onObj)); },
    });
    if (pending.trim()) parseLine(pending, onObj);
  } finally { inFlight = false; ctl = null; renderConsole(); }
}

function offlineMind() { return pick(MINDS[level(state.suspicion)]); }

    intent: pick(INTENTS[level(after)]), escape: after >= 80 && Math.random() < .7,

const ERR = {
  rate_limited: 'DeepSeek 限流了，稍等一会儿再开拍。经费已退回。',
  invalid_request: 'DeepSeek 拒绝了这次请求，换个安排再试试。经费已退回。',
  cancelled: '喊卡！这场不算，经费已退回。',
  empty_completion: '导演组交了白卷，换个安排再试试。经费已退回。',
  upstream_error: '信号中断（连不上 DeepSeek），这场没拍成。经费已退回，可以重拍。',
};
// 这些错误重试也没用：切到排练模式，并在状态栏说明原因
const PERMANENT_WHY = {
  no_key: '本地服务没有配置 DEEPSEEK_API_KEY，先用排练剧本',
  auth_failed: 'DeepSeek 说 key 无效，检查 .env 后重启服务',

};
const PERMANENT = new Set(Object.keys(PERMANENT_WHY));

// 浏览器只请求本地服务的 /api/chat，key 留在 server.js 里。调用方式与 v0.1 的 sample() 一致。
let llmModels = { quick: 'deepseek-chat', default: 'deepseek-reasoner' };
async function llmSample(prompt, opts = {}) {
  const fail = (code, message, text) => { const e = { code, message }; if (text) e.text = text; return e; };
  let res;
  try {
    res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt, tier: opts.modelTier }), signal: opts.signal });
  } catch (e) {
    throw fail(e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error', String(e && e.message || e));
  }
  if (!res.ok) {
    let j = {};
    try { j = await res.json(); } catch (e) { /* not json */ }
    throw fail(j.code || 'upstream_error', j.message || res.statusText);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let text = '';
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      const delta = dec.decode(value, { stream: true });
      if (!delta) continue;
      text += delta;
      if (opts.onText) opts.onText({ text, delta });
    }
  } catch (e) {
    throw fail(e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error', String(e && e.message || e), text);
  }
  if (!text.trim()) throw fail('empty_completion', 'DeepSeek 没有返回内容');
  return { text, truncated: false };
}

async function stageScene(o, ctx, takeIdx) {

async function playBeat(o) {

async function runScene() {

function applyEnd(ctx, got) {
  const e = got.end;
  const delta = clamp(int(e.delta), -12, 30);
  const esc = ctx.escapeBefore && ctx.card.cat !== 'block' ? 15 : 0;
  const s0 = state.suspicion;
  state.suspicion = clamp(s0 + delta + esc, 0, 100);
  const drama = clamp(int(e.drama) || ctx.card.drama, 1, 10);
  const tired = state.lastCat === ctx.card.cat;
  const target = 420 + drama * 85 + (ctx.accident ? 60 : 0) - (tired ? 80 : 0) + Math.round(Math.random() * 60 - 30);
  const r = Math.max(120, Math.round(state.ratings * 0.5 + target * 0.5));
  state.ratings = r; state.hist.push(r); if (state.hist.length > 22) state.hist.shift();
  state.dayRatings.push(r); state.total += r;
  state.lowStreak = r < 600 ? state.lowStreak + 1 : 0;
  state.lastCat = ctx.card.cat;
  state.take++;
  if (ctx.card.id === 'ex') state.flags.yu = true;
  if (ctx.card.id === 'father') state.flags.dad = true;
  if (ctx.card.once) state.used.push(ctx.card.id);
  const stamp = `${ctx.day}·${SLOTS[ctx.slot]}`;
  const noticed = clean(e.noticed, 60);
  if (noticed) state.clues.push({ d: stamp, t: noticed });
  const memo = clean(e.memo, 60);
  if (memo) { state.memos.push(`第${ctx.day}天${SLOTS[ctx.slot]}：${memo}`); if (state.memos.length > 12) state.memos.shift(); }
  const intent = clean(e.intent, 30); if (intent) state.intent = intent;
  state.pendingEscape = e.escape === true || e.escape === 'true' || state.suspicion >= 85;
  state.minds.unshift({ d: `第 ${ctx.day} 天 · ${SLOTS[ctx.slot]}`, text: got.mind }); state.minds.length = Math.min(state.minds.length, 3);
  const note = clean(e.actor_note, 70); if (note) pushLog({ k: 'note', text: note });
  pushLog({ k: 'res', text: `怀疑 ${s0} → ${state.suspicion}（${sgn(delta)}${esc ? '，没拦住他 +15' : ''}） · 收视 ${fmt(r)} 万${tired ? '（同类戏连播，观众腻了）' : ''}${state.lowStreak ? ` · 低收视 ${state.lowStreak}/3` : ''}` });
  const dm = Array.isArray(e.danmu) ? e.danmu.map(x => clean(x, 24)).filter(Boolean) : [];
  spawnDanmu(dm.length ? dm : pickN(DANMU, 4));
  view.speaker = null; view.tz = 1; view.acc = null;
  setSubtitle('', '', '');

  if (state.suspicion >= 100) {
    state.finale = true; view.finale = true; view.tr.tx = 1528; view.place = '大桥';
    pushLog({ k: 'sys', text: '林楚冲过了大桥，来到了晴港的尽头。天空，原来是一面墙。' });
    return;
  }
  if (state.lowStreak >= 3) { endGame('cancel'); return; }
  advance();
}

function advance() {
  state.slot++;
  if (state.slot > 2) {
    const avg = Math.round(state.dayRatings.reduce((a, b) => a + b, 0) / Math.max(1, state.dayRatings.length));
    state.dayRatings = [];
    if (state.day >= 7) { endGame('season'); return; }
    state.day++; state.slot = 0;
    const income = clamp(Math.round(40 + (avg - 600) / 6), 20, 160);
    state.budget += income;
    pushLog({ k: 'day', text: `第 ${state.day} 天` });

  }
  view.slot = state.slot;
  rollAccident(); deal();
  state.sel.whisper = ''; state.sel.sponsor = false;
}

  busy = false; inFlight = false; document.body.classList.remove('shooting');
  state = newGame(state && state.crew);
  $('#danmu').replaceChildren();
  $('#finale-words').value = '';
  resetView(); save(); renderAll();
}
function armRestart(btn) {
  if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = '重开'; restart(); return; }
  btn.dataset.armed = '1'; btn.textContent = '确定重开？';
  setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = '重开'; } }, 3000);
}

$('#go').addEventListener('click', runScene);
$('#whisper').addEventListener('input', e => { state.sel.whisper = e.target.value; save(); });
$('#sponsor').addEventListener('change', e => { state.sel.sponsor = e.target.checked; save(); renderConsole(); });
$('#crew').addEventListener('change', e => { state.crew = e.target.value; save(); renderStatus(); renderConsole(); });
$('#cut').addEventListener('click', () => { if (ctl) ctl.abort(); });
$('#skip').addEventListener('click', () => { skipFast = true; });
$('#monitor').addEventListener('click', () => { if (busy && !inFlight) skipFast = true; });
$('#finale-go').addEventListener('click', () => runFinale(false));
$('#finale-silent').addEventListener('click', () => runFinale(true));
$('#restart-top').addEventListener('click', e => armRestart(e.currentTarget));
$('#restart-end').addEventListener('click', restart);
$('#restart-overlay').addEventListener('click', restart);
$('#close-overlay').addEventListener('click', () => { if (state.ended) { state.ended.hidden = true; save(); renderOverlay(); } });
$('#show-ending').addEventListener('click', () => { if (state.ended) { state.ended.hidden = false; renderOverlay(); } });

setInterval(() => {
  const sec = Math.floor(SLOT_SEC[view.slot] + (busy ? (performance.now() - tcStart) / 1000 * 8 : 0)) % 86400;
  const p = n => String(n).padStart(2, '0');
  $('#tc').textContent = `${p(Math.floor(sec / 3600))}:${p(Math.floor(sec / 60) % 60)}:${p(sec % 60)}`;
}, 500);

const samplePromise = fetch('/api/status', { cache: 'no-store' })
  .then(r => r.json())
  .then(s => { if (s && s.models) llmModels = s.models; return s && s.ai ? llmSample : null; })
  .catch(() => null);
samplePromise.then(s => { sample = s; sampleChecked = true; if (state) { renderStatus(); renderConsole(); } });

state = load() || newGame();
if (!CARD[state.sel.card]) deal();
resetView(); renderAll();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
